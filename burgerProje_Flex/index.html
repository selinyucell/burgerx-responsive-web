<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Burger X</title>
</head>

<body>
    <section class="HeaderSection">
        <div class="HeaderDiv">
            <div class="LogoDiv">
                <img src="burgerfotolar/1.png" alt="">
            </div>
            <div class="AboutDiv">
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Contact</a>
            </div>

            <div class="cizgiler">
                <p class="cizgi1"></p>
                <p class="cizgi2"></p>
                <p class="cizgi3"></p>
            </div>
            <nav class="acilanMenu">
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Contact</a>
            </nav>
        </div>
    </section>



    <section>
        <div class="backgroundFoto">
            <h1 class="burgerMenu">Burger Menu</h1>
        </div>
    </section>

    <section>
        <div class="burgersMainDiv">
            <div class="burgerResDiv">
                <div class="burger">
                    <img src="burgerfotolar/3.png" alt="">
                    <h3>Big Burger</h3>
                    <p>Double Beef Burger</p>
                    <p>200TL</p>
                    <button class="order">Order Now</button>
                </div>
            </div>
            <div class="burgerResDiv">
                <div class="burger">
                    <img src="burgerfotolar/4.png" alt="">
                    <h3>Chicken Burger</h3>
                    <p>Chrispy Chicken Burger</p>
                    <p>150TL</p>
                    <button class="order">Order Now</button>
                </div>
            </div>

            <div class="burgerResDiv">
                <div class=" burger">
                    <img src="burgerfotolar/5.png" alt="">
                    <h3>Beef Burger Menu</h3>
                    <p>Burger + Fries + Drink</p>
                    <p>300TL</p>
                    <button class="order">Order Now</button>
                </div>
            </div>

            <div class="burgerResDiv">
                <div class=" burger">
                    <img src="burgerfotolar/6.png" alt="">
                    <h3>Chicken Burger Menu</h3>
                    <p>Chicken Burger + Fries + Drink</p>
                    <p>250TL</p>
                    <button class="order">Order Now</button>
                </div>
            </div>
        </div>
    </section>
</body>
<script src="script.js"></script>

</html>
